server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80;
    listen [::]:80;
    server_name ca.lunaeth.com learn.lunaeth.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ca.lunaeth.com;
    ssl_certificate /etc/nginx/tls/ctest.pem;
    ssl_certificate_key /etc/nginx/tls/ctest.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ctest_tls:10m;
    ssl_session_timeout 1d;
    root /var/www/lunaeth-portal/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    include /etc/nginx/cloudflare-allow.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ /\. { deny all; }
    location ~ ^/(network-map|core2-visual|security-plus-visual|ai-map|ai-review|hardware-visual|printer-visual|troubleshooting-visual)\.html$ {
        return 301 https://learn.lunaeth.com$request_uri;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learn.lunaeth.com;
    ssl_certificate /etc/nginx/tls/learn.pem;
    ssl_certificate_key /etc/nginx/tls/learn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ctest_tls:10m;
    ssl_session_timeout 1d;
    root /var/www/ctest/current;
    include /etc/nginx/ctest-account-api-location.conf;
    index index.html;
    server_tokens off;
    charset utf-8;
    include /etc/nginx/cloudflare-allow.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
